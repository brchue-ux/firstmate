# Builds the Autonomy Android app and uploads an installable debug APK.
#
# The development session cannot build it: the Android SDK and every AndroidX
# artifact are served from dl.google.com, which its egress policy blocks.
# GitHub's ubuntu runners ship the SDK, so the build happens here instead.
#
# The trigger is a plain branch push. Manual dispatch only works once a
# workflow lives on the default branch, and tag refs cannot be pushed from
# the development session at all.
name: Autonomy Android

on:
  push:
    branches:
      - 'claude/autonomy-android-app-**'
    paths:
      - 'autonomy-app/**'
      - '.github/workflows/autonomy-android.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: autonomy-app

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      # Needed only by the courier-branch cleanup below.
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --stacktrace is deliberately absent: on a Kotlin compile failure it
      # emits ~400 lines of Gradle internals that bury the handful of `e:` lines
      # that actually say what is wrong. Instead the build log is captured and,
      # on failure, the compiler diagnostics are re-printed at the very end
      # where they are the first thing anyone reads.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # Gradle reports nothing about how many tests ran, so a green build says
      # only "nothing failed" - it cannot distinguish a passing suite from a
      # suite that silently lost files. It already had: an unanchored `data/`
      # ignore rule kept a whole test class out of the repository, and CI went
      # green without it. Printing the totals makes that visible.
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/**/*.xml", recursive=True)
          if not files:
              print("No test result XML found - did the test task run?")
              raise SystemExit(0)
          total = failed = skipped = 0
          for f in files:
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0))
              failed += int(r.get("failures", 0)) + int(r.get("errors", 0))
              skipped += int(r.get("skipped", 0))
          print(f"{total} tests across {len(files)} classes: "
                f"{total - failed - skipped} passed, {failed} failed, {skipped} skipped")
          for f in sorted(files):
              r = ET.parse(f).getroot()
              print(f"  {r.get('tests'):>3}  {r.get('name')}")
          PY

      - name: Assemble debug APK
        run: ./gradlew assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Compiler diagnostics
        if: failure()
        run: |
          echo "==================== COMPILER ERRORS ===================="
          grep -E "^e: |^w: |FAILED$|^\s+> " "$RUNNER_TEMP/build.log" \
            | grep -vE "^w: .*(deprecat|never used|opt-in)" \
            | head -60 \
            || echo "(no e:/w: lines found - failure was not a Kotlin compile error)"
          echo "========================================================="

      # Signed with the runner's debug keystore, so it sideloads as-is.
      # Download it from the run's Summary page (arrives zipped).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-debug-apk
          path: autonomy-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A workflow artifact can only be fetched from Azure blob storage, which
      # the development session's egress policy blocks; it can reach github.com
      # over git. So when the commit message asks for it, the runner hands the
      # APK back on a single-commit branch. The branch is a courier, not
      # history: force-pushed, and retired once the APK is collected.
      # Retires the courier branch on any build that is not itself a drop, so
      # a 17 MB binary never lingers on a ref once it has been collected.
      - name: Retire the courier branch
        if: "!contains(github.event.head_commit.message, '[apk]')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          remote="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$remote" apk-delivery >/dev/null 2>&1; then
            git push -q "$remote" --delete apk-delivery
            echo "Retired the apk-delivery courier branch."
          else
            echo "No courier branch to retire."
          fi

      - name: Drop the APK on the delivery branch
        if: contains(github.event.head_commit.message, '[apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          drop="$RUNNER_TEMP/drop"
          mkdir -p "$drop"
          cp app/build/outputs/apk/debug/app-debug.apk "$drop/autonomy-debug.apk"
          cd "$drop"
          git init -q -b apk-delivery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add autonomy-debug.apk
          git commit -q -m "APK drop for ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" \
            apk-delivery
