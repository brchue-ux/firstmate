# Builds the Autonomy Android app and publishes an installable debug APK.
#
# This machine cannot build it: the Android SDK and every AndroidX artifact are
# served from dl.google.com, which is blocked by the session's egress policy.
# GitHub's ubuntu runners ship the SDK, so the build happens here instead.
#
# Scoped to autonomy-app/ so it never fires on ordinary firstmate changes.
name: Autonomy Android

on:
  push:
    paths:
      - 'autonomy-app/**'
      - '.github/workflows/autonomy-android.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Attach the APK to a prerelease for one-tap phone install'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: autonomy-app

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      # Only the release step needs write; it is gated on the manual input.
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Signed with the runner's debug keystore, so it sideloads as-is.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-debug-apk
          path: autonomy-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish prerelease with the APK
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="autonomy-debug-${{ github.run_number }}"
          gh release create "$tag" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Autonomy debug build ${{ github.run_number }}" \
            --notes "Unsigned-for-store debug build. Open this page on the phone and tap the APK to install." \
            --prerelease
