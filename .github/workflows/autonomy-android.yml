# Builds the Autonomy Android app and publishes an installable debug APK.
#
# The development session cannot build it: the Android SDK and every AndroidX
# artifact are served from dl.google.com, which its egress policy blocks.
# GitHub's ubuntu runners ship the SDK, so the build happens here instead.
#
# Pushing a tag like autonomy-v0.1.0 additionally drops the built APK onto a
# single-commit `apk-delivery` branch. That exists because a workflow artifact
# can only be fetched from Azure blob storage, which the development session's
# egress policy also blocks, whereas it can reach github.com over git. The
# branch is a transient hand-off and is deleted once the APK is collected.
#
# A tag push is the trigger rather than workflow_dispatch because manual
# dispatch only works once a workflow lives on the default branch, and this
# one is still on a feature branch. Path filters are left off for the same
# reason - they do not combine cleanly with tag refs - so the branch pattern
# is what keeps this off unrelated firstmate work.
name: Autonomy Android

on:
  push:
    branches:
      - 'claude/autonomy-android-app-**'
    tags:
      - 'autonomy-v*'

permissions:
  contents: read

defaults:
  run:
    working-directory: autonomy-app

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      # Needed only by the release step, which is gated on a version tag.
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Signed with the runner's debug keystore, so it sideloads as-is.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-debug-apk
          path: autonomy-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Hand the APK back through the repo, the one transport the development
      # session can actually read. Orphan single-commit branch, force-pushed,
      # deleted as soon as the APK is collected - it is a courier, not history.
      - name: Drop the APK on the delivery branch
        if: startsWith(github.ref, 'refs/tags/autonomy-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          drop="$RUNNER_TEMP/drop"
          mkdir -p "$drop"
          cp app/build/outputs/apk/debug/app-debug.apk "$drop/autonomy-debug.apk"
          cd "$drop"
          git init -q -b apk-delivery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add autonomy-debug.apk
          git commit -q -m "APK drop for ${{ github.ref_name }} (${{ github.sha }})"
          git push -q --force \
            "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" \
            apk-delivery
