# Builds the Autonomy Android app and publishes an installable debug APK.
#
# The development session cannot build it: the Android SDK and every AndroidX
# artifact are served from dl.google.com, which its egress policy blocks.
# GitHub's ubuntu runners ship the SDK, so the build happens here instead.
#
# Pushing a tag like autonomy-v0.1.0 additionally attaches the APK to a
# release, which is the phone-friendly way to install it: a direct .apk link
# rather than a zipped workflow artifact.
#
# A tag push is the release trigger rather than workflow_dispatch because
# manual dispatch only works once a workflow lives on the default branch,
# and this one is still on a feature branch. Path filters are left off for
# the same reason - they do not combine cleanly with tag refs - so the branch
# pattern is what keeps this off unrelated firstmate work.
name: Autonomy Android

on:
  push:
    branches:
      - 'claude/autonomy-android-app-**'
    tags:
      - 'autonomy-v*'

permissions:
  contents: read

defaults:
  run:
    working-directory: autonomy-app

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      # Needed only by the release step, which is gated on a version tag.
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Signed with the runner's debug keystore, so it sideloads as-is.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-debug-apk
          path: autonomy-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release with the APK
        if: startsWith(github.ref, 'refs/tags/autonomy-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cp app/build/outputs/apk/debug/app-debug.apk "autonomy-${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" \
            "autonomy-${{ github.ref_name }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Autonomy ${{ github.ref_name }}" \
            --notes "Debug build, signed with a throwaway debug key - fine for personal sideloading, not for the Play Store. Open this page on the phone and tap the .apk to install." \
            --prerelease
